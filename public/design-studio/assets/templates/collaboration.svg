<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none"><rect width="1600" height="900" fill="#f3f6f2"/><g font-family="Microsoft YaHei,sans-serif"><text x="90" y="130" font-size="52" font-weight="700" fill="#203a37">同一份业务事实，接续现场与管理。</text><rect x="90" y="280" width="390" height="280" rx="36" fill="#fff" stroke="#c8d9c9"/><text x="120" y="385" font-size="32" fill="#0f6e7c">App 现场办理</text><text x="120" y="455" font-size="23" fill="#52665f">原生设计原型 · 待实现</text><rect x="600" y="280" width="390" height="280" rx="36" fill="#fff" stroke="#c8d9c9"/><text x="630" y="385" font-size="32" fill="#0f6e7c">共享 FastAPI 服务</text><text x="630" y="455" font-size="23" fill="#52665f">SQLite / 媒体 / 审计回执</text><rect x="1110" y="280" width="390" height="280" rx="36" fill="#fff" stroke="#c8d9c9"/><text x="1140" y="385" font-size="32" fill="#0f6e7c">Web 管理分析</text><text x="1140" y="455" font-size="23" fill="#52665f">现有已接入的业务模块</text><path d="M500 420h75m-15-15 15 15-15 15m450 0 15-15-15-15m-60 15h75" stroke="#7b9c88" stroke-width="5"/><text x="90" y="710" font-size="27" fill="#52665f">协同使用 HTTP 与共同后端；不是鸿蒙分布式软总线能力。</text><text x="90" y="770" font-size="27" fill="#52665f">匿名设计模板 · 硬件输入模拟 · 不声称实体传感器或声光模块已接通</text></g></svg>